[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-vae"
version = "0.1.0"
description = "Quantum VAE experiments and trainer code for reproducible paper runs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "torch",
  "torchmetrics",
  "torch-fidelity",
  "PennyLane",
  "torchvision",
  "matplotlib",
  "qiskit",
  "requests",
  "tqdm",
  "einops",
  "Pillow",
  "transformers",
  "diffusers[torch]",
  "huggingface_hub",
  "scikit-image",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
